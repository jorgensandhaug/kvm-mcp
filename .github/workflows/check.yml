name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.95.0 fmt --check
      - run: cargo +1.95.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.95.0 test --locked
      - run: cargo +1.95.0 build --locked
      - run: sh -n scripts/install.sh && sh -n scripts/package.sh && sh scripts/test-install.sh
  linux-binaries:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.95.0 --profile minimal --target ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo +1.95.0 build --locked --release --target ${{ matrix.target }}
      - run: sh scripts/package.sh ${{ matrix.target }} > dist-checksums.txt
      - run: cargo +1.95.0 metadata --locked --format-version 1 | node scripts/licenses.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/kvm-mcp-*
            dist/third-party-licenses/
            LICENSE
            dist-checksums.txt
