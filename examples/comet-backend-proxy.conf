# Optional local bridge for firmware whose HTTPS certificate cannot be verified.
# Never change this listener to a public address. KVMD still authenticates calls.
user root;
worker_processes 1;
pid /run/kvm-mcp-proxy.pid;
error_log /tmp/kvm-mcp-proxy.log warn;
events { worker_connections 64; }
http {
  client_body_temp_path /tmp/kvm-mcp-proxy/client;
  proxy_temp_path /tmp/kvm-mcp-proxy/proxy;
  fastcgi_temp_path /tmp/kvm-mcp-proxy/fastcgi;
  uwsgi_temp_path /tmp/kvm-mcp-proxy/uwsgi;
  scgi_temp_path /tmp/kvm-mcp-proxy/scgi;
  access_log off;
  client_max_body_size 0;
  include /etc/kvmd/nginx/kvmd.ctx-http.conf;
  server {
    listen 127.0.0.1:9101;
    location /api/ {
      proxy_pass http://kvmd/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 7200s;
      proxy_send_timeout 7200s;
    }
    location /streamer/ {
      auth_request /auth_check;
      proxy_pass http://ustreamer/;
      proxy_buffering off;
    }
    location = /auth_check {
      internal;
      proxy_pass http://kvmd/auth/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }
  }
}
